name: HOMIQ checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homiq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run unit tests
        run: pnpm test
      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit
